<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Izac</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Mis Gustos y Pasatiempos</h1>
    </header>

    <main>
        <!-- Comidas Favoritas -->
        <section>
            <h2>Comidas Favoritas</h2>
            <div class="grid-cards">
                <div class="card">
                    <img src="Baleadas.jpg" alt="Baleadas">
                    <p>Baleadas</p>
                </div>
                <div class="card">
                    <img src="tajadas.jpg" alt="Tajadas con Pollo">
                    <p>Tajadas con Pollo</p>
                </div>
                <div class="card">
                    <img src="hamburguessas.jpg" alt="Hamburguesas">
                    <p>Hamburguessas</p>
                </div>
            </div>
        </section>

        <!-- Pasatiempos -->
        <section>
            <h2>Pasatiempos</h2>
            <div class="grid-cards">
                <div class="card">
                    <img src="boxeo.jpg" alt="Boxeo">
                    <p>"Montarme a un ring y boxear"</p>
                </div>
                <div class="card">
                    <img src="moto.jpg" alt="Moto">
                    <p>"Salir a rodar en moto"</p>
                </div>
                <div class="card">
                    <img src="militar.jpg" alt="Visitar Base Aérea">
                    <p>"Visitar la Base Aérea de las Fuerzas Armadas"</p>
                </div>
            </div>
        </section>

        <!-- Fotos Familia -->
        <section>
            <h2>Familia</h2>
            <div class="grid-fotos">
                <img src="familia.jpg" alt="Foto en familia">
                <img src="familia2.jpg" alt="Foto en familia">
                <img src="familia3.jpg" alt="Foto en familia">
            </div>
        </section>

        <!-- Fotos Amigos -->
        <section>
            <h2>Amigos</h2>
            <div class="grid-fotos">
                <img src="amigos.jpg" alt="Foto con amigos">
                <img src="amigos2.jpg" alt="Foto con amigos">
                <img src="amigos3.jpg" alt="Foto con amigos">
            </div>
        </section>
        <section>
            <h2>Colores Favoritos </h2>
            <div class="grid-fotos">
                <img src="negro.png" alt="Foto con amigos">
                <img src="rojo.jpg" alt="Foto con amigos">
                <img src="azul.jpg" alt="Foto con amigos">
            </div>
        </section>
    </main>

    <nav>
        <a href="index.html">Volver a inicio</a>
    </nav>
</body>
</html>
